title: "Migrate ItemList to React 19"

description: |
  Finishes the React 19 upgrade for the item listing widget. `ItemList` was the
  last component still on the React 16 class API, so once this lands we can drop
  the legacy compat aliases from the build.

  ## What changed

  - `ItemList` is a function component now: `this.state` → `useState`, the string
    ref → `useRef`, and the `componentWillUnmount` teardown → the effect cleanup.
  - `UNSAFE_componentWillReceiveProps` is gone, replaced by the supported
    "adjust state during render" pattern from the React 19 upgrade guide.
  - `propTypes` are dropped — `ItemListProps` already covers the same shape at
    compile time, so the runtime copy was dead weight.
  - The mount helper moves from `ReactDOM.render` to `createRoot`, holding one
    root per container so remounting a placeholder no longer warns.
  - `react`, `react-dom` and their `@types` are bumped to 19. Lockfile
    regenerated in the same commit.

  ## Behaviour

  No behaviour change. This is a mechanical API migration — the component loads,
  filters and renders exactly what it did on React 16, with the same prop
  defaults.

  ## Testing

  Checked by hand against the staging catalogue: search, selection, "show all",
  and switching categories in the sidebar all behave as they did on 16. No new
  tests — there is no new behaviour to cover.
