name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The Astro app at the repository root.
  app:
    name: App (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Standalone npm project: its own lockfile, its own tsconfig, its own eslint config. The root
  # `npm ci` never installs it and the root `eslint .` now ignores `packages/**`, so this job is
  # the package's only gate. Parallel to `app` — the two trees are independent.
  #
  # This builds and tests `packages/code-reviewer`. It runs no AI review: that is the separate
  # `AI Code Review` workflow, which owns `.github/actions/ai-code-review`.
  reviewer-package:
    name: Reviewer package (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/code-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc and makes the package's `engines: >=22.22.0` floor explicit (promptfoo's floor).
          node-version: "22.23"
          cache: npm
          # setup-node looks for a root lockfile by default; this package carries its own.
          cache-dependency-path: packages/code-reviewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Non-blocking by decision: the reviewer's suite reports but does not gate.
      - run: npm run test
        continue-on-error: true
      # Also proves the `tsc` path and that `dist/` is reproducible from a clean tree.
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
